        .final-quiz:hover {
            background-color: #ffdab9;
            border-color: #ffa07a;
            transform: translateY(-4px) rotate(1deg); /* 반대 방향으로 기우뚱 */

            color: #ff0055;
            font-size: 21px;
            font-weight: bold;
            margin-top: 5px;

            border-color: #ff477e;
            color: #ffffff;
            transform: translateY(-5px) scale(1.02);
